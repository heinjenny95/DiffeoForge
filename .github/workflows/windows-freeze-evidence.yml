name: Windows freeze evidence

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Requested packaging evidence target"
        type: choice
        options: [windows, macos-probe, macos, macos-verify]
        default: windows
      source_run:
        description: "Mac candidate workflow run ID (verification only)"
        type: string
        default: ""
      verify_architecture:
        description: "Candidate architecture for independent verification"
        type: choice
        options: [all, Intel, AppleSilicon]
        default: all

permissions:
  contents: read

concurrency:
  group: windows-freeze-evidence-${{ inputs.target || 'windows' }}-${{ inputs.verify_architecture || 'all' }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  freeze-evidence:
    if: ${{ inputs.target == 'windows' || inputs.target == '' }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen CPU desktop builder
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,desktop,modern-engine,sbom-builder]"
          python -m pip install -r distribution/windows/freeze-requirements.txt
          python -c "import platform, PyInstaller, torch; assert platform.python_version_tuple()[:2] == ('3', '12'); assert PyInstaller.__version__ == '6.21.0'; assert torch.version.cuda is None"

      - name: Build and verify clean-runner bundle evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $smokeRoot = Join-Path $env:RUNNER_TEMP "DiffeoForge Freeze Käfer"
          $synthetic = Join-Path $smokeRoot "synthetic"
          New-Item -ItemType Directory -Path $smokeRoot | Out-Null
          Copy-Item -LiteralPath "examples/synthetic" -Destination $synthetic -Recurse

          $referenceConfig = Join-Path $smokeRoot "reference-atlas.yaml"
          $modernConfig = Join-Path $smokeRoot "modern-atlas.yaml"
          Copy-Item -LiteralPath "examples/minimal-atlas-container.yaml" -Destination $referenceConfig
          Copy-Item -LiteralPath "examples/minimal-modern-atlas.yaml" -Destination $modernConfig

          $approval = Join-Path $smokeRoot "preparation-approval.json"
          $fingerprint = (& python -c "import sys; from diffeoforge.reference_preparation_plan import plan_reference_preparation, reference_preparation_plan_fingerprint; print(reference_preparation_plan_fingerprint(plan_reference_preparation(sys.argv[1], run_id='clean-runner-preparation')))" $referenceConfig).Trim()
          if ($LASTEXITCODE -ne 0 -or $fingerprint -notmatch "^[0-9a-f]{64}$") {
            throw "Could not create the synthetic reviewed plan fingerprint."
          }
          $approvalArguments = @(
            "-m", "diffeoforge", "reference-plan-approve", $referenceConfig,
            "--run-id", "clean-runner-preparation",
            "--approve-fingerprint", $fingerprint,
            "--output", $approval
          )
          & python @approvalArguments | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Could not create the synthetic preparation-only approval."
          }
          $approvalSha256 = (Get-FileHash -LiteralPath $approval -Algorithm SHA256).Hash.ToLowerInvariant()

          $dist = Join-Path $env:RUNNER_TEMP "windows-freeze-dist"
          $work = Join-Path $env:RUNNER_TEMP "windows-freeze-work"
          $modernDestination = Join-Path $smokeRoot "Käfer Modern Result"
          $buildArguments = @{
            Python = (Get-Command python).Source
            DistPath = $dist
            WorkPath = $work
            SmokeConfig = $modernConfig
            SmokeDestination = $modernDestination
            PreparationApproval = $approval
            PreparationConfig = $referenceConfig
            PreparationApprovalSha256 = $approvalSha256
          }
          & distribution/windows/build-evidence.ps1 @buildArguments
          if ($LASTEXITCODE -ne 0) {
            throw "The frozen bundle evidence build failed."
          }

          $bundle = Join-Path $dist "DiffeoForge"
          & python tools/desktop_bundle_evidence.py verify $bundle
          if ($LASTEXITCODE -ne 0) {
            throw "Independent final bundle-evidence verification failed."
          }

          $evidenceDirectory = Join-Path $env:RUNNER_TEMP "freeze-evidence-upload"
          New-Item -ItemType Directory -Path $evidenceDirectory | Out-Null
          Copy-Item -LiteralPath (Join-Path $bundle "freeze-evidence.json") -Destination $evidenceDirectory
          Copy-Item -LiteralPath (Join-Path $bundle "freeze-evidence.sha256") -Destination $evidenceDirectory
          $expected = ((Get-Content -LiteralPath (Join-Path $evidenceDirectory "freeze-evidence.sha256") -Raw).Trim() -split "\s+")[0]
          $observed = (Get-FileHash -LiteralPath (Join-Path $evidenceDirectory "freeze-evidence.json") -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $observed) {
            throw "Copied freeze evidence does not match its SHA-256 sidecar."
          }

          & python tools/desktop_dependency_metadata_evidence.py create $bundle `
            --expect-freeze-evidence-sha256 $observed `
            --output-directory $evidenceDirectory
          if ($LASTEXITCODE -ne 0) {
            throw "Dependency metadata evidence creation failed."
          }
          $dependencyEvidence = Join-Path $evidenceDirectory "freeze-dependency-metadata.json"
          & python tools/desktop_dependency_metadata_evidence.py verify $dependencyEvidence `
            --expect-freeze-evidence-sha256 $observed
          if ($LASTEXITCODE -ne 0) {
            throw "Independent dependency metadata evidence verification failed."
          }
          $dependencyExpected = ((Get-Content -LiteralPath (Join-Path $evidenceDirectory "freeze-dependency-metadata.sha256") -Raw).Trim() -split "\s+")[0]
          $dependencyObserved = (Get-FileHash -LiteralPath $dependencyEvidence -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($dependencyExpected -ne $dependencyObserved) {
            throw "Dependency metadata evidence does not match its SHA-256 sidecar."
          }

          & python tools/desktop_sbom.py create $bundle $dependencyEvidence `
            --expect-freeze-evidence-sha256 $observed `
            --expect-dependency-evidence-sha256 $dependencyObserved `
            --output-directory $evidenceDirectory
          if ($LASTEXITCODE -ne 0) {
            throw "CycloneDX SBOM creation failed."
          }
          $sbomEvidence = Join-Path $evidenceDirectory "freeze-sbom.cdx.json"
          $sbomExpected = ((Get-Content -LiteralPath (Join-Path $evidenceDirectory "freeze-sbom.cdx.sha256") -Raw).Trim() -split "\s+")[0]
          $sbomObserved = (Get-FileHash -LiteralPath $sbomEvidence -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sbomExpected -ne $sbomObserved) {
            throw "CycloneDX SBOM does not match its SHA-256 sidecar."
          }
          & python tools/desktop_sbom.py verify $sbomEvidence `
            (Join-Path $evidenceDirectory "freeze-evidence.json") `
            $dependencyEvidence `
            --expect-freeze-evidence-sha256 $observed `
            --expect-dependency-evidence-sha256 $dependencyObserved `
            --expect-sbom-sha256 $sbomObserved
          if ($LASTEXITCODE -ne 0) {
            throw "Independent CycloneDX SBOM verification failed."
          }

          $uploadedEntries = @(Get-ChildItem -LiteralPath $evidenceDirectory -Force)
          $uploadedFiles = @($uploadedEntries | Where-Object { -not $_.PSIsContainer })
          $unsafeUploadEntries = @($uploadedEntries | Where-Object {
            $_.PSIsContainer -or ($_.Attributes -band [IO.FileAttributes]::ReparsePoint)
          })
          $expectedUploadNames = @(
            "freeze-dependency-metadata.json",
            "freeze-dependency-metadata.sha256",
            "freeze-evidence.json",
            "freeze-evidence.sha256",
            "freeze-sbom.cdx.json",
            "freeze-sbom.cdx.sha256"
          )
          $observedUploadNames = @($uploadedFiles.Name | Sort-Object)
          if ($uploadedEntries.Count -ne 6 -or $uploadedFiles.Count -ne 6 -or $unsafeUploadEntries.Count -ne 0 -or (Compare-Object $expectedUploadNames $observedUploadNames)) {
            throw "Evidence upload boundary must contain exactly the six approved files."
          }

          $manifest = Get-Content -LiteralPath (Join-Path $evidenceDirectory "freeze-evidence.json") -Raw | ConvertFrom-Json
          $dependencies = Get-Content -LiteralPath $dependencyEvidence -Raw | ConvertFrom-Json
          $sbom = Get-Content -LiteralPath $sbomEvidence -Raw | ConvertFrom-Json
          @(
            "## Windows clean-runner freeze evidence"
            ""
            "- Source commit: $($manifest.source.commit_sha)"
            "- Bundle files: $($manifest.bundle.file_count)"
            "- Bundle bytes: $($manifest.bundle.total_bytes)"
            "- Inventory SHA-256: $($manifest.bundle.inventory_sha256)"
            "- Evidence SHA-256: $observed"
            "- Dependency metadata packages: $($dependencies.package_count)"
            "- Dependency metadata SHA-256: $dependencyObserved"
            "- SBOM: $($sbom.bomFormat) $($sbom.specVersion)"
            "- SBOM serial number: $($sbom.serialNumber)"
            "- SBOM components: $($sbom.components.Count)"
            "- SBOM composition: $($sbom.compositions[0].aggregate)"
            "- SBOM SHA-256: $sbomObserved"
            "- License/redistribution review: not reviewed"
            "- Uploaded boundary: three evidence files and three sidecars only; no executable bundle"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "FREEZE_EVIDENCE_UPLOAD=$evidenceDirectory" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload exact evidence only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-freeze-evidence-${{ github.sha }}
          path: ${{ env.FREEZE_EVIDENCE_UPLOAD }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  macos-independent-install:
    if: ${{ inputs.target == 'macos-verify' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.verify_architecture == 'Intel' && '[{"os":"macos-15-intel","artifact_os":"macos-15-intel"},{"os":"macos-26-intel","artifact_os":"macos-15-intel"}]' || inputs.verify_architecture == 'AppleSilicon' && '[{"os":"macos-15","artifact_os":"macos-15"},{"os":"macos-26","artifact_os":"macos-15"}]' || '[{"os":"macos-15-intel","artifact_os":"macos-15-intel"},{"os":"macos-15","artifact_os":"macos-15"},{"os":"macos-26-intel","artifact_os":"macos-15-intel"},{"os":"macos-26","artifact_os":"macos-15"}]') }}
    env:
      PIP_DEFAULT_TIMEOUT: "90"
      PIP_RETRIES: "6"
      OMP_NUM_THREADS: "1"
      MPLBACKEND: Agg
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install external verification tools only
        run: python -m pip install -e '.[analysis]'
      - name: Fetch the exact already-built candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
          name: DiffeoForge-v202-${{ matrix.artifact_os }}-${{ github.sha }}
          path: ${{ runner.temp }}/mac-candidate
      - name: Independently install and compute from downloaded DMG
        run: python -B distribution/macos/verify-downloaded-package.py '${{ runner.temp }}/mac-candidate' '${{ runner.temp }}/Independent Mac Käfer'
      - name: Keep public qualification evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-independent-install-${{ matrix.os }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/Independent Mac Käfer/independent-verification.json
            ${{ runner.temp }}/Independent Mac Käfer/public-workflows/runs/*/logs/deformetrica.log
          if-no-files-found: warn
          retention-days: 2

  macos-reference-probe:
    if: ${{ inputs.target == 'macos-probe' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    env:
      OMP_NUM_THREADS: "1"
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install qualification tools
        run: python -m pip install -e '.[analysis]'
      - name: Native reference setup and actual public-mesh execution
        run: python -B distribution/macos/reference-probe.py '${{ runner.temp }}/DiffeoForge Native Käfer'
      - name: Upload public engineering evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-reference-probe-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/DiffeoForge Native Käfer/mac-reference-probe.json
            ${{ runner.temp }}/DiffeoForge Native Käfer/native-imports.txt
            ${{ runner.temp }}/DiffeoForge Native Käfer/runs/*/logs/deformetrica.log
          if-no-files-found: warn
          retention-days: 2

  macos-package:
    if: ${{ inputs.target == 'macos' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    env:
      PIP_DEFAULT_TIMEOUT: "90"
      PIP_RETRIES: "6"
      OMP_NUM_THREADS: "1"
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install desktop builder and test tools
        run: |
          python -m venv "$RUNNER_TEMP/mac-builder"
          echo "$RUNNER_TEMP/mac-builder/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/mac-builder/bin/python" -m pip install -e '.[desktop,dev]' -r distribution/macos/desktop-requirements.txt
          "$RUNNER_TEMP/mac-builder/bin/python" -m pip check
      - name: Check native pilot and UI software paths
        run: |
          pytest -q tests/test_pilot_iteration_budget.py tests/test_pilot_iteration_budget_transfer.py \
            tests/test_reference_calibration_dialog.py tests/test_desktop_worker_controller.py \
            tests/test_macos_packaging.py tests/test_build_version.py \
            tests/test_pilot_theme_contrast.py tests/test_specimen_comparison_dialog.py \
            tests/test_pca_observed_shapes.py \
            tests/test_desktop_input_preflight.py::test_existing_alignment_opens_read_only_gpa_viewer_before_confirmation \
            tests/test_desktop_input_preflight.py::test_existing_alignment_discards_changed_mesh_without_reusing_preflight \
            tests/test_desktop_v143_visualizations.py::test_score_plot_opens_exact_specimen_on_click_but_not_drag \
            tests/test_guided_shared_check.py::test_suitable_local_fit_has_explicit_nonrunning_next_action \
            tests/test_pilot_common_adoption_navigation.py::test_approved_candidate_pins_adoption_and_preserves_individual_reviews \
            tests/test_pilot_native_continuation.py::test_dialog_selects_new_continuation_result_for_fresh_review \
            tests/test_pilot_native_continuation.py::test_dialog_compares_continuation_with_immediate_checkpoint_source \
            tests/test_pilot_region_feedback.py::test_joint_regional_feedback_measures_the_named_checked_endpoint \
            tests/test_guided_pilot.py::test_coverage_skips_duplicate_extreme_but_retains_new_direction_and_manual_choice \
            tests/test_guided_pilot.py::test_coverage_checks_every_remaining_form_after_mandatory_subjects \
            tests/test_guided_pilot.py::test_coverage_limits_diverse_cohort_but_retains_all_required_forms \
            tests/test_desktop_calibration.py::test_desktop_prepares_pilot_from_existing_alignment_in_mixed_formats \
            tests/test_desktop_calibration.py::test_desktop_limits_automatic_pilot_and_accepts_larger_manual_count
      - name: Qualify native Intel-compatible reference runtime
        run: python -B distribution/macos/reference-probe.py '${{ runner.temp }}/DiffeoForge Native Käfer'
      - name: Build and qualify installable Mac package
        run: python -B distribution/macos/build-package.py '${{ runner.temp }}/DiffeoForge Native Käfer' '${{ runner.temp }}/DiffeoForge Mac Build'
      # Transfer only the candidate and its verification files. Clean up the
      # temporary candidate after independent qualification and local retrieval.
      - name: Temporary owner-authorized Mac package transfer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: DiffeoForge-v202-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/DiffeoForge Mac Build/delivery/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
