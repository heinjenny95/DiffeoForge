name: Reference container

on:
  pull_request:
    paths:
      - ".github/workflows/reference-container.yml"
      - ".dockerignore"
      - "container/**"
      - "examples/minimal-atlas-container.yaml"
      - "reference/synthetic-v1/**"
      - "tools/probe_reference_cpu.py"
      - "src/diffeoforge/backends/**"
      - "src/diffeoforge/runs.py"
      - "src/diffeoforge/schema/atlas-config-v0.1.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/reference-container.yml"
      - ".dockerignore"
      - "container/**"
      - "examples/minimal-atlas-container.yaml"
      - "reference/synthetic-v1/**"
      - "tools/probe_reference_cpu.py"
      - "src/diffeoforge/backends/**"
      - "src/diffeoforge/runs.py"
      - "src/diffeoforge/schema/atlas-config-v0.1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-run-compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up modern host Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install DiffeoForge host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config
          python -m pip install --upgrade pip
          python -m pip install -e ".[analysis,dev]"

      - name: Build frozen CPU image
        run: |
          docker build \
            --platform linux/amd64 \
            --file container/Dockerfile \
            --tag diffeoforge-deformetrica:4.3.0-cpu .

      - name: Verify frozen versions and CPU isolation
        run: |
          docker run --rm --entrypoint python \
            diffeoforge-deformetrica:4.3.0-cpu \
            -c "import importlib.metadata as m, torch; assert m.version('deformetrica') == '4.3.0'; assert torch.__version__ == '1.6.0+cpu'; assert not torch.cuda.is_available()"

      - name: Execute public synthetic atlas
        run: |
          diffeoforge run examples/minimal-atlas-container.yaml \
            --run-id container-ci

      - name: Diagnose public float32 reductions without changing the atlas
        run: |
          mkdir reference-cpu-evidence
          for mode in AUTO COMPATIBLE; do
            docker run --rm --network=none --read-only \
              --tmpfs=/tmp:rw,exec,nosuid,size=1g \
              --user "$(id -u):$(id -g)" \
              --mount "type=bind,source=$PWD,target=/source,readonly" \
              --mount "type=bind,source=$PWD/reference-cpu-evidence,target=/evidence" \
              --env OMP_NUM_THREADS=4 --env MKL_CBWR="$mode" \
              --entrypoint python diffeoforge-deformetrica:4.3.0-cpu \
              /source/tools/probe_reference_cpu.py --repository /source \
              --output "/evidence/probe-$mode.json"
          done

      - name: Compare numerical reference
        run: |
          diffeoforge compare-reference \
            examples/runs/container-ci reference/synthetic-v1

      - name: Retain bounded public diagnostic evidence even on comparison failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reference-cpu-evidence
          retention-days: 14
          if-no-files-found: error
          path: |
            reference-cpu-evidence/*.json
            examples/runs/container-ci/logs/convergence.csv
            examples/runs/container-ci/logs/deformetrica.log
            examples/runs/container-ci/output/DeterministicAtlas__EstimatedParameters__Residuals.txt
